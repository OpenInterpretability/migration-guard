# Push a tag vX.Y.Z: the pin is checked, the GitHub release is created from CHANGELOG.md, and the major tag (vX)
# is moved to it, so `uses: OpenInterpretability/migration-guard@v1` follows the latest 1.x.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Check the ekbasis pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .github/ekbasis-pin
          used=$(grep -oE 'OpenInterpretability/ekbasis/actions/migration-guard@[0-9a-f]{40}' action.yml | cut -d@ -f2)
          [ "$used" = "$EKBASIS_SHA" ] || { echo "::error::action.yml uses $used, .github/ekbasis-pin says $EKBASIS_SHA"; exit 1; }
          ref=$(gh api "repos/OpenInterpretability/ekbasis/git/ref/tags/$EKBASIS_TAG" --jq '.object.type + " " + .object.sha')
          sha=${ref#* }
          [ "${ref%% *}" = tag ] && sha=$(gh api "repos/OpenInterpretability/ekbasis/git/tags/$sha" --jq .object.sha)
          [ "$sha" = "$EKBASIS_SHA" ] || { echo "::error::ekbasis $EKBASIS_TAG is $sha, not the pinned $EKBASIS_SHA"; exit 1; }
          echo "ekbasis $EKBASIS_TAG = $EKBASIS_SHA"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v t="${TAG#v}" '/^## /{p = index($0, "[" t "]") > 0; next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no section for $TAG"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
