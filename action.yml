name: Ekbasis Migration Guard
description: Foresee whether a pull request's PostgreSQL migrations lose data or fail on the existing database.
author: OpenInterpretability
branding:
  icon: shield
  color: blue

# This action is a thin wrapper. The steps live in OpenInterpretability/ekbasis (actions/migration-guard) and are
# pinned below by full commit SHA, not by tag: a tag can be moved, a commit cannot. The pin is the release
# EKBASIS_TAG in .github/ekbasis-pin; the release workflow refuses a tag whose pin and SHA disagree.

inputs:
  api-key:
    description: Ekbasis API key (ekb_...). Pass it from a secret. A self-hosted server without keys accepts any value.
    required: true
  api-url:
    description: Ekbasis server (default, the hosted API; or your own server with the open weights).
    default: https://openinterp.org/api/v1
  base-ref:
    description: The branch the pull request merges into (default, the pull request's base).
    default: ""
  paths:
    description: Which files are migrations, one fnmatch glob per line (default, Prisma, Diesel, *.up.sql and *migrations/*.sql).
    default: ""
  lost-threshold:
    description: Risky when P(data lost) reaches this.
    default: "0.5"
  fail-threshold:
    description: Risky when P(a statement fails) reaches this.
    default: "0.5"
  autocommit:
    description: "true: statements commit one by one (psql -f). Default: one transaction per file, as Prisma, Diesel and golang-migrate run it."
    default: "false"
  mode:
    description: "comment (one PR comment, updated on each push), check (the job fails when risky), or both."
    default: both
  fail-on:
    description: "risky (fail on risky and on cannot foresee) or never."
    default: risky
  db-stats-url:
    description: Optional read-only replica URL, from a secret. Only planner statistics are read (row estimates, NULL fractions, distinct counts), never values.
    default: ""
  framework:
    description: "sql (default: SQL migration files), django or alembic. For django and alembic the framework renders the SQL, running the pull request's code only inside a container with no network and no secrets."
    default: sql
  image:
    description: Generator image for django/alembic (default python:3.12-slim).
    default: ""
  setup:
    description: "Shell command run in the generator, in the head tree, WITH network, before the network is cut (e.g. pip install -r requirements.txt)."
    default: ""
  workdir:
    description: Where manage.py or alembic.ini is, inside the repository.
    default: "."
  env:
    description: "K=V lines for the generator (${EKBASIS_DB_URL} becomes the scratch database's URL). Never put secrets here: the pull request's code reads them."
    default: ""
  migrate-command:
    description: The command that migrates the base (default per framework).
    default: ""
  alembic-command:
    description: alembic (default) or flask db.
    default: ""
  on-code:
    description: "django/alembic: a migration with code that is not SQL (RunPython, no offline SQL) is listed as 'code not foreseen, review by hand' and does not fail the check (warn, default), or fails closed (block)."
    default: warn
  setup-sql:
    description: "Path of a SQL file run before the base's migrations by the scratch server's admin (superuser) connection: schemas, roles or extensions your platform creates outside the migrations (e.g. Supabase's auth schema). :guard_role names the role the migrations run as. SECURITY: read from the BASE branch (git show <base>:<path>), never from the pull request, because it runs with privileges; a pull request that changes it takes effect only after it is merged."
    default: ""
  postgres-image:
    description: The scratch PostgreSQL the schema is built in.
    default: postgres:16
  github-token:
    description: Token used to write the comment (needs pull-requests write).
    default: ${{ github.token }}
  verdict-cache:
    description: >-
      true: reuse the model's answer for a migration already checked with the same file, base schema, client version,
      transaction mode and statistics (30 days, in the Actions cache): no model call, no tokens. false: always ask.
    default: "true"

outputs:
  verdict:
    description: ok, risky or cannot-foresee.
    value: ${{ steps.guard.outputs.verdict }}
  result:
    description: Path of the JSON result.
    value: ${{ steps.guard.outputs.result }}

runs:
  using: composite
  steps:
    - id: guard
      # ekbasis v0.1.20
      uses: OpenInterpretability/ekbasis/actions/migration-guard@209353139a23aa3682bd83513415abb732dec338
      with:
        api-key: ${{ inputs.api-key }}
        api-url: ${{ inputs.api-url }}
        base-ref: ${{ inputs.base-ref }}
        paths: ${{ inputs.paths }}
        lost-threshold: ${{ inputs.lost-threshold }}
        fail-threshold: ${{ inputs.fail-threshold }}
        autocommit: ${{ inputs.autocommit }}
        mode: ${{ inputs.mode }}
        fail-on: ${{ inputs.fail-on }}
        db-stats-url: ${{ inputs.db-stats-url }}
        postgres-image: ${{ inputs.postgres-image }}
        github-token: ${{ inputs.github-token }}
        verdict-cache: ${{ inputs.verdict-cache }}
        setup-sql: ${{ inputs.setup-sql }}
        framework: ${{ inputs.framework }}
        image: ${{ inputs.image }}
        setup: ${{ inputs.setup }}
        workdir: ${{ inputs.workdir }}
        env: ${{ inputs.env }}
        migrate-command: ${{ inputs.migrate-command }}
        alembic-command: ${{ inputs.alembic-command }}
        on-code: ${{ inputs.on-code }}
